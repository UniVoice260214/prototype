services:
  postgres:
    image: postgres:16-alpine
    container_name: univoice-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: univoice
    ports:
      - "5432:5432"
    volumes:
      - univoice-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d univoice"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: univoice-redis
    ports:
      - "6379:6379"
    volumes:
      - univoice-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: univoice-azurite
    command: azurite-blob --blobHost 0.0.0.0 --location /workspace --skipApiVersionCheck
    ports:
      - "10000:10000" # blob
    volumes:
      - univoice-azuritedata:/workspace

volumes:
  univoice-pgdata:
  univoice-redisdata:
  univoice-azuritedata:
