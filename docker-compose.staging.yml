name: univoice-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: univoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: univoice
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U univoice -d univoice"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - staging-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: runtime
    restart: "no"
    environment: &api-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://univoice:${POSTGRES_PASSWORD}@postgres:5432/univoice
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_JOIN_TOKEN_EXPIRES_IN: ${JWT_JOIN_TOKEN_EXPIRES_IN:-24h}
      AUTH_DISABLED: "false"
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      LIVEKIT_TOKEN_TTL_SEC: ${LIVEKIT_TOKEN_TTL_SEC:-14400}
      AZURE_BLOB_CONNECTION_STRING: ${AZURE_BLOB_CONNECTION_STRING}
      AZURE_BLOB_CONTAINER: ${AZURE_BLOB_CONTAINER:-univoice-materials}
      # 업로드 강의자료의 익명 읽기. rag-indexer-daemon 이 업로드 파일을 URL 로 직접
      # 내려받으므로, 끄면 업로드 자료의 RAG 인덱싱이 동작하지 않는다(데모 코퍼스는 무관).
      # 켜면 URL 을 아는 누구나 로그인 없이 자료를 받을 수 있다. 기본은 끄고, 필요한
      # 서버만 .env.staging 에서 켠다. 운영 전환 전 SAS 또는 인증된 다운로드로 바꿀 것.
      AZURE_BLOB_PUBLIC_ACCESS: ${AZURE_BLOB_PUBLIC_ACCESS:-false}
      AZURE_BLOB_PUBLIC_BASE_URL: ${AZURE_BLOB_PUBLIC_BASE_URL:-}
      QR_BASE_URL: https://${STAGING_DOMAIN}/join
      RAG_INDEX_QUEUE: ${RAG_INDEX_QUEUE:-rag:index:queue}
      WORKER_STOP_TIMEOUT_SEC: ${WORKER_STOP_TIMEOUT_SEC:-8}
      WORKER_STOP_POLL_INTERVAL_MS: ${WORKER_STOP_POLL_INTERVAL_MS:-200}
      CORS_ORIGINS: https://${STAGING_DOMAIN}
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    command: ["npm", "run", "migration:run:prod"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: runtime
    restart: "no"
    environment:
      <<: *api-environment
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Staging Admin}
    command: ["npm", "run", "seed:prod"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      <<: *api-environment
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  ai-worker:
    build:
      context: ./ai-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION}
      STT_LANGUAGE: ${STT_LANGUAGE:-ko-KR}
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-08-01-preview}
      SEGMENT_MAX_CHARS: ${SEGMENT_MAX_CHARS:-120}
      SEGMENT_IDLE_FLUSH_MS: ${SEGMENT_IDLE_FLUSH_MS:-2000}
      TTS_TIMEOUT_SEC: ${TTS_TIMEOUT_SEC:-15}
      TTS_MAX_RETRIES: ${TTS_MAX_RETRIES:-2}
      TTS_MAX_CONCURRENCY: ${TTS_MAX_CONCURRENCY:-3}
      WORKER_STATUS_TTL_SEC: ${WORKER_STATUS_TTL_SEC:-3600}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_URL: http://rag-service:8000
      RAG_DEFAULT_MAJOR: ${RAG_DEFAULT_MAJOR:-auto}
      RAG_COURSE_MAJOR_MAP: ${RAG_COURSE_MAJOR_MAP:-}
      RAG_TIMEOUT_SEC: ${RAG_TIMEOUT_SEC:-0.4}
      STT_SEGMENTATION_SILENCE_MS: ${STT_SEGMENTATION_SILENCE_MS:-800}
      SEGMENT_SPLIT_KOREAN_CLAUSES: ${SEGMENT_SPLIT_KOREAN_CLAUSES:-false}
      CAPTION_DRAFT_ENABLED: ${CAPTION_DRAFT_ENABLED:-false}
      CAPTION_DRAFT_INTERVAL_MS: ${CAPTION_DRAFT_INTERVAL_MS:-1000}
      TTS_MAX_QUEUE_WAIT_MS: ${TTS_MAX_QUEUE_WAIT_MS:-3000}
      TTS_SPEAKING_RATE: ${TTS_SPEAKING_RATE:-1.0}
      # 지연 계측 JSONL (docs/latency-measurement.md). 비우면 끈다. 예: /tmp/latency.jsonl
      LATENCY_LOG_PATH: ${LATENCY_LOG_PATH:-}
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
      rag-service:
        condition: service_healthy

  # ---------- RAG (전공 용어 컨텍스트 검색) ----------
  # 데모 코퍼스 인덱스 1회 빌드. 모델(KURE-v1) 다운로드 포함, 첫 실행 10~15분.
  rag-indexer:
    image: univoice-staging-rag
    build:
      context: ./rag-experiment
    restart: "no"
    command: ["python", "src/build_demo_indexes.py"]
    environment:
      RAG_MODEL: kure
      RAG_MAX_SEQ_LENGTH: ${RAG_MAX_SEQ_LENGTH:-512}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - staging-rag-indexes:/app/indexes
      - staging-rag-chunks:/app/data/chunks
      - staging-hf-cache:/cache/huggingface

  # 업로드된 강의자료를 과목별 인덱스에 누적 인덱싱하는 상주 데몬.
  # staging 은 진짜 Azure Blob 을 쓰므로 BLOB_URL_REWRITE 는 필요 없다.
  rag-indexer-daemon:
    image: univoice-staging-rag
    build:
      context: ./rag-experiment
    restart: unless-stopped
    command: ["python", "src/indexer_daemon.py"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RAG_INDEX_QUEUE: ${RAG_INDEX_QUEUE:-rag:index:queue}
      RAG_SERVICE_URL: http://rag-service:8000
      RAG_MODEL: kure
      RAG_MAX_SEQ_LENGTH: ${RAG_MAX_SEQ_LENGTH:-512}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - staging-rag-indexes:/app/indexes
      - staging-rag-chunks:/app/data/chunks
      - staging-hf-cache:/cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      rag-indexer:
        condition: service_completed_successfully

  rag-service:
    image: univoice-staging-rag
    build:
      context: ./rag-experiment
    restart: unless-stopped
    environment:
      RAG_MODEL: kure
      RAG_MAX_SEQ_LENGTH: ${RAG_MAX_SEQ_LENGTH:-512}
      RAG_TOP_K: ${RAG_TOP_K:-3}
      RAG_CONTEXT_MAX_CHARS: ${RAG_CONTEXT_MAX_CHARS:-4000}
      RAG_COURSE_INDEX_MAP: ${RAG_COURSE_INDEX_MAP:-}
      RAG_SEARCH_CONCURRENCY: ${RAG_SEARCH_CONCURRENCY:-2}
      RAG_SEARCH_CACHE_SIZE: ${RAG_SEARCH_CACHE_SIZE:-256}
      RAG_SEARCH_CACHE_TTL_SEC: ${RAG_SEARCH_CACHE_TTL_SEC:-300}
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - staging-rag-indexes:/app/indexes:ro
      - staging-rag-chunks:/app/data/chunks:ro
      - staging-hf-cache:/cache/huggingface
    depends_on:
      rag-indexer:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging-caddy-data:/data
      - staging-caddy-config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  staging-postgres:
  staging-rag-indexes:
  staging-rag-chunks:
  staging-hf-cache:
  staging-redis:
  staging-caddy-data:
  staging-caddy-config:
